<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Wedding CRM</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📷%3C/text%3E%3C/svg%3E">

#nav button:hover{background:var(--bg)}#nav button.on{background:var(--ac);color:var(--on)}
#main{flex:1;overflow:auto;padding:22px 28px}
h2{font:600 22px var(--fh);margin:0 0 14px}h3,h4{margin:14px 0 8px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}button.dg{color:var(--dg)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}

tr[data-a]{cursor:pointer}tr[data-a]:hover{background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.c small{color:var(--mu);display:block}.c b{font-size:20px}
.pos{color:#2e8b57}.neg{color:var(--dg)}
#m{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:9}
.box{background:var(--card);border-radius:10px;padding:20px;width:620px;max-width:94vw;max-height:92vh;overflow:auto}
.sum{background:var(--bg);padding:10px;border-radius:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>b{color:var(--mu);font-size:12px;text-align:center}
.day{background:var(--card);border:1px solid var(--bd);min-height:84px;padding:4px;border-radius:6px;cursor:pointer}.day small{color:var(--mu)}
.ev{background:var(--ac);color:var(--on);border-radius:4px;padding:1px 5px;margin-top:2px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars span{display:flex;gap:2px;align-items:flex-end;flex:1}.bars i{flex:1;display:block;border-radius:3px 3px 0 0}
.empty{color:var(--mu);padding:20px;text-align:center}
.pies{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:16px}
tr.done td{border-top:2px solid #2e8b57;border-bottom:2px solid #2e8b57}tr.done td:first-child{border-left:2px solid #2e8b57}tr.done td:last-child{border-right:2px solid #2e8b57}
.chk{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px}.chk input{width:auto;margin:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px 18px}
.sec h3{margin:0 0 2px;font:600 16px var(--fh)}.sec .d{margin:0 0 12px;color:var(--mu);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 6px 3px 12px}
.chip button{border:0;background:none;padding:0 4px;color:var(--mu)}.chip button:hover{color:var(--dg)}
#credit{margin-top:auto;font-size:11px;color:var(--mu);text-align:center;padding:8px 6px;line-height:1.4}
#credit a,.sec .d a{color:var(--ac)}
.kofi{display:inline-flex;align-items:center;gap:8px;background:#ff5e5b;color:#fff!important;padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:600}.kofi:hover{filter:brightness(1.08)}.c svg path:hover,.c svg circle:hover{opacity:.75}
#invp{display:none}#invp table{width:100%;border-collapse:collapse;background:#fff;border:0;border-radius:0}#invp td,#invp th{border-bottom:1px solid #ddd;padding:8px 6px;color:#111;background:#fff}
@media print{@page{size:A4;margin:0}@page land{size:A4 landscape;margin:0}#invp.land{page:land}html,body{height:auto!important;background:#fff!important;display:block!important}#side,#main,#m{display:none!important}#invp{display:block;padding:18mm}}

<script>

let db=Object.assign({leads:[],customers:[],events:[],cats:['Wedding','Christening'],services:['Photography','Videography'],team:[],statuses:[{n:'New',c:'#6a8caf',k:'open'},{n:'Contacted',c:'#d9a441',k:'open'},{n:'Meeting',c:'#8a6fa8',k:'open'},{n:'Proposal sent',c:'#d9803f',k:'open'},{n:'Won',c:'#2e8b57',k:'won'},{n:'Lost',c:'#8a8f98',k:'lost'}],bkDays:0,subs:[],social:[],b2b:[],vault:{},stDays:30,forms:[{id:'f1',title:"Couple details",intro:"Please fill in the details below and send the form back to us.",sign:true,fields:[{label:"Bride's full name",type:'line',value:''},{label:"Groom's full name",type:'line',value:''},{label:"Mobile phones",type:'line',value:''},{label:"Email",type:'line',value:''},{label:"Home address",type:'line',value:''},{label:"Event date",type:'date',value:'{date}'},{label:"Ceremony location",type:'line',value:'{ceremony}'},{label:"Reception location",type:'line',value:'{reception}'},{label:"Number of guests",type:'line',value:''},{label:"Special requests / notes",type:'box',value:''}]}],font:'classic',b2bCats:['Album prints','Services'],todos:[],packages:[],expPresets:['Fuel','Second shooter','Accommodation'],teamFees:{},teamInfo:{},svcDays:{},tl:{Wedding:"10:00 Bride preparation\n11:30 Groom preparation\n12:30 Couple portraits\n17:30 Ceremony\n18:30 Family & group photos\n19:30 Reception starts\n21:30 Cake & first dance",Christening:"10:00 Preparation at home\n11:00 Arrival at the church\n11:30 Christening\n13:00 Family photos\n13:30 Reception"},
contract:{en:"PHOTOGRAPHY & VIDEOGRAPHY SERVICES AGREEMENT\n\nThis agreement is made on {contractdate} between {business} ({owner}, tax no. {bizvat}, {bizaddress}), the Photographer, and {client} ({address}, tax no. {taxid}), the Client.\n\n1. Event. {type} of {couple} on {date} at {time}. Ceremony: {ceremony}. Reception: {reception}.\n\n2. Services. The Photographer will provide: {services}.\n\n3. Fee. The total fee is {total}. A deposit of {deposit} secures the date. The remaining {remaining} is payable before the event.\n\n4. Delivery. The final material is delivered within the agreed deadlines after the event.\n\n5. Cancellation. If the Client cancels, the deposit is not refunded. If force majeure prevents the Photographer from attending, all amounts paid are refunded.\n\n6. Copyright. The Photographer keeps the copyright and may use selected images to present their work, unless the Client objects in writing. The Client may use the material for personal purposes.\n\nSignatures:\n\n__________________        __________________\nThe Photographer            The Client",
el:"ΣΥΜΦΩΝΙΑ ΠΑΡΟΧΗΣ ΥΠΗΡΕΣΙΩΝ ΦΩΤΟΓΡΑΦΙΑΣ & ΒΙΝΤΕΟΓΡΑΦΗΣΗΣ\n\nΣτις {contractdate} συμφωνήθηκαν μεταξύ του/της {business} ({owner}, ΑΦΜ {bizvat}, {bizaddress}), εφεξής «ο Φωτογράφος», και του/της {client} ({address}, ΑΦΜ {taxid}), εφεξής «ο Πελάτης», τα εξής:\n\n1. Εκδήλωση. {type} των {couple} στις {date} και ώρα {time}. Τελετή: {ceremony}. Δεξίωση: {reception}.\n\n2. Υπηρεσίες. Ο Φωτογράφος θα παρέχει: {services}.\n\n3. Αμοιβή. Η συνολική αμοιβή ανέρχεται σε {total}. Προκαταβολή {deposit} κλείνει την ημερομηνία. Το υπόλοιπο {remaining} καταβάλλεται πριν από την εκδήλωση.\n\n4. Παράδοση. Το τελικό υλικό παραδίδεται εντός των συμφωνημένων προθεσμιών μετά την εκδήλωση.\n\n5. Ακύρωση. Σε περίπτωση ακύρωσης από τον Πελάτη η προκαταβολή δεν επιστρέφεται. Σε περίπτωση ανωτέρας βίας που εμποδίζει τον Φωτογράφο, επιστρέφονται όλα τα ποσά που έχουν καταβληθεί.\n\n6. Πνευματικά δικαιώματα. Τα πνευματικά δικαιώματα ανήκουν στον Φωτογράφο, ο οποίος μπορεί να χρησιμοποιεί επιλεγμένο υλικό για την παρουσίαση του έργου του, εκτός αν ο Πελάτης αντιρρήσει εγγράφως. Ο Πελάτης μπορεί να χρησιμοποιεί το υλικό για προσωπική χρήση.\n\nΥπογραφές:\n\n__________________        __________________\nΟ Φωτογράφος                  Ο Πελάτης"},
templates:[
{id:'t1',name:'Offer',subject:"Offer for your {type} – {couple}",body:"Hello {name},\n\nThank you for thinking of us for your {type} on {date} at {place}. It would be an honour to be part of your day.\n\nOur offer for {couple}: {amount}.\nA deposit secures the date, and the remaining amount is paid before the event.\n\nIf you would like to change anything, or talk through the details, just tell me.\n\nBest regards,\n{owner}\n{business}"},
{id:'t2',name:'Follow-up on offer',subject:"Following up – {type} on {date}",body:"Hello {name},\n\nI wanted to follow up on the offer I sent for your {type} on {date}. Do you have any questions, or would you like to arrange a call or a meeting?\n\nI can only hold a date for a limited time, so I would love to know if you would like to go ahead.\n\nBest regards,\n{owner}\n{business}"},
{id:'t3',name:'Payment reminder',subject:"Payment reminder – {type} on {date}",body:"Hello {name},\n\nA friendly reminder that the remaining balance for your {type} on {date} is {remaining}.\n\nPlease let me know if you have any questions.\n\nBest regards,\n{owner}\n{business}"},
{id:'t4',name:'Thank you & delivery',subject:"Your {type} photos and videos",body:"Hello {name},\n\nThank you for trusting us with your {type}. Your material is ready, and I will send you the link shortly.\n\nIt was a pleasure,\n{owner}\n{business}"}],drives:[],methods:['Cash','Bank transfer','Card'],biz:{},cols:['date','type','couple','client','location','services','sold','received','remaining','expenses'],theme:'light'},JSON.parse(localStorage.getItem('weddingcrm')||'{}'));
let bkT;const save=()=>{localStorage.setItem('weddingcrm',JSON.stringify(db));clearTimeout(bkT);bkT=setTimeout(autoBackup,2500)};
if(!db.mig1){db.templates.push({id:'t5',name:'Anniversary',subject:"Happy anniversary {couple}!",body:"Hello {name},\n\nHappy anniversary to {couple}! It has been {years} since your {type} on {date}, and it was a joy to be part of it.\n\nIf you would like an anniversary photo session, I would love to arrange one.\n\nWarm wishes,\n{owner}\n{business}"});db.mig1=1;save()}
const cn=id=>(db.customers.find(c=>c.id==id)||{}).name||'No client';
const paid=e=>(+e.deposit||0)+sum(e.payments),rem=e=>(+e.sold||0)-paid(e),title=e=>e.type+' – '+(e.couple||cn(e.customerId));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const locs=e=>{const a=(e.locCer||e.location||'').trim(),b=(e.locRec||'').trim();return a&&b&&a.toLowerCase()==b.toLowerCase()?a:[a,b].filter(Boolean).join(' → ')};
const svcInfo=e=>{const on=db.services.filter(s=>e.svc&&e.svc[s]&&e.svc[s].on),left=on.filter(s=>!e.svc[s].done);return{on,left,all:on.length>0&&!left.length,late:left.filter(s=>e.svc[s].due&&e.svc[s].due<today())}};
const mapsUrl=(n,l)=>l||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n||'');
const yearEvents=()=>db.events.filter(e=>(e.date||'').startsWith(yr));
let tab='today',yr=new Date().getFullYear(),cal=new Date();cal.setDate(1);
const tabs=[['today','Today'],['reports','Reports'],['leads','Leads'],['customers','Customers'],['events','Events'],['calendar','Calendar'],['forms','Forms'],['media','Media Storage'],['subs','Subscriptions'],['marketing','Marketing'],['analytics','Analytics'],['b2b','B2B Contacts'],['logins','Logins'],['settings','Settings']];
const STATUS=['New','Contacted','Meeting','Proposal sent','Won','Lost'];

/* ---------- forms ---------- */
function modal(h){$('#m').innerHTML='<div class=box>'+h+'</div>';$('#m').style.display='flex'}
const closeM=()=>$('#m').style.display='none';
function fields(fs,v){return fs.map(f=>`<label${f.w?' style="grid-column:1/-1"':''}>${f.l}${f.t=='select'?`<select name=${f.k}>${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==v[f.k]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea name=${f.k} rows=${f.r||3}>${esc(v[f.k]||'')}</textarea>`:`<input name=${f.k} type=${f.t||'text'} value="${esc(v[f.k]??'')}">`}</label>`).join('')}
function read(fs){const o={};fs.forEach(f=>{const el=$('#m [name='+f.k+']');o[f.k]=f.t=='number'?(+el.value||0):el.value});return o}
function crud(kind,id,fs,defaults,extra){
  const it=db[kind].find(x=>x.id==id)||{...defaults};
  modal(`<h3>${id?'Edit':'New'} ${CRUDN[kind]||kind.slice(0,-1)}</h3><div class=grid>${fields(fs,it)}</div><div class=row><button class=pri id=sv>Save</button><button id=cx>Cancel</button>${id?'<button class=dg id=dl>Delete</button>':''}${extra?extra.html:''}</div>`);
  $('#cx').onclick=closeM;
  $('#sv').onclick=()=>{Object.assign(it,read(fs));if(!id){it.id=uid();db[kind].push(it)}save();closeM();render()};
  if(id)$('#dl').onclick=()=>{if(confirm('Delete this record?')){db[kind]=db[kind].filter(x=>x.id!=id);save();closeM();render()}};
  if(extra)extra.bind(it);
}
const catOpts=()=>db.cats.map(c=>[c,c]);
const leadFs=()=>[{k:'name',l:'Name'},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email'},{k:'viber',l:'Uses Viber',t:'select',o:YN},{k:'whatsapp',l:'Uses WhatsApp',t:'select',o:YN},{k:'type',l:'Event category',t:'select',o:catOpts()},{k:'date',l:'Event date',t:'date'},{k:'source',l:'Source (Instagram, referral…)'},{k:'followUp',l:'Next follow-up',t:'date'},{k:'package',l:'Interested in package',t:'select',o:[['','—'],...db.packages.map(p=>[p.id,p.name+' – '+money(p.price)])]},{k:'status',l:'Status',t:'select',o:db.statuses.map(s=>[s.n,s.n])},{k:'notes',l:'Notes',t:'textarea'}];
const YN=[['no','No'],['yes','Yes']];
const custFs=[{k:'name',l:'Name'},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email'},{k:'viber',l:'Uses Viber',t:'select',o:YN},{k:'whatsapp',l:'Uses WhatsApp',t:'select',o:YN},{k:'address',l:'Street address'},{k:'city',l:'City'},{k:'country',l:'Country'},{k:'zip',l:'Postal code'},{k:'taxId',l:'Tax / VAT number'},{k:'taxOffice',l:'Tax office'},{k:'notes',l:'Notes',t:'textarea',w:1}];
const tplFs=[{k:'name',l:'Template name'},{k:'subject',l:'Email subject'},{k:'body',l:'Message',t:'textarea',r:10,w:1}];
function editLead(id){
  const fs=leadFs(),l=id?JSON.parse(JSON.stringify(db.leads.find(x=>x.id==id))):{status:(db.statuses[0]||{n:'New'}).n,type:db.cats[0]};l.log=l.log||[];const old=l.status;
  const sync=()=>{Object.assign(l,read(fs));document.querySelectorAll('#m .ll').forEach(el=>{l.log[el.dataset.i][el.dataset.f]=el.value})};
  const put=()=>{l.log.sort((a,b)=>(a.date||'').localeCompare(b.date||''));const i=db.leads.findIndex(x=>x.id==l.id);if(i>=0)db.leads[i]=l;else{l.id=uid();db.leads.push(l)}save()};
  const draw=()=>{
    modal(`<h3>${id?'Edit':'New'} lead</h3><div class=grid>${fields(fs,l)}</div><h4>Updates</h4>
    ${l.log.map((x,i)=>`<div class=row><input class=ll type=date data-i=${i} data-f=date value="${x.date}" style="max-width:150px;flex:none"><input class=ll data-i=${i} data-f=text value="${esc(x.text)}"><button data-rm=${i}>✕</button></div>`).join('')||'<small style="color:var(--mu)">No updates yet.</small>'}
    <div class=row><input id=nd type=date value="${today()}" style="max-width:150px;flex:none"><input id=nt placeholder="What happened? (call, meeting, quote sent…)"><button id=ad>+ Add update</button></div>
    <p style="color:var(--mu);margin:0"><small>A status change is added to the updates automatically when you save.</small></p>
    <div class=row><button class=pri id=sv>Save</button><button id=cx>Cancel</button>${id?'<button id=cv>Convert to client + event</button><button id=msgb>Message…</button><button class=dg id=dl>Delete</button>':''}</div>`);
    $('#cx').onclick=closeM;
    $('#ad').onclick=()=>{sync();const t=$('#nt').value.trim();if(!t)return;l.log.push({date:$('#nd').value||today(),text:t});draw()};
    document.querySelectorAll('#m [data-rm]').forEach(b=>b.onclick=()=>{sync();l.log.splice(+b.dataset.rm,1);draw()});
    $('#sv').onclick=()=>{sync();const cl=l.date?db.events.filter(x=>x.date==l.date):[];if(cl.length&&!confirm('There is already an event on this date: '+cl.map(title).join(', ')+'. Save anyway?'))return;if(!id)l.log.push({date:today(),text:'Lead added ('+l.status+')'});else if(l.status!=old)l.log.push({date:today(),text:'Status: '+old+' → '+l.status});put();closeM();render()};
    if(id){
      $('#msgb').onclick=()=>{sync();actions.msgLead(l.id)};
      $('#dl').onclick=()=>{if(confirm('Delete this lead?')){db.leads=db.leads.filter(x=>x.id!=id);save();closeM();render()}};
      $('#cv').onclick=()=>{sync();const c={id:uid(),name:l.name,phone:l.phone,email:l.email,viber:l.viber,whatsapp:l.whatsapp,notes:''};db.customers.push(c);db.events.push({id:uid(),customerId:c.id,type:l.type,date:l.date,time:'',location:'',staff:0,sold:0,deposit:0,payments:[],expenses:[],notes:l.notes||''});const w=(db.statuses.find(x=>x.k=='won')||{n:'Won'}).n;l.log.push({date:today(),text:'Converted to client + event'+(l.status!=w?' (status: '+l.status+' → '+w+')':'')});l.status=w;put();closeM();tab='events';render()};
    }
  };draw();
}

/* ---------- events + google calendar ---------- */
const fd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
function span(e){const s=new Date(e.date+'T'+(e.time||'10:00'));return[fd(s),fd(new Date(s.getTime()+8*36e5))]}
function gcal(e){const[a,b]=span(e);return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title(e))+'&dates='+a+'/'+b+'&location='+encodeURIComponent(e.locCer||e.location||'')+'&details='+encodeURIComponent('Reception: '+(e.locRec||'-')+' | People needed: '+(e.staff||0))}
function editEvent(id,date){

function pie(t,data){data=data.filter(d=>d.v>0);const T=data.reduce((s,d)=>s+d.v,0);if(!T)return `<div class=c><small>${t}</small><div class=empty>No data</div></div>`;let a=-Math.PI/2,p='';
  data.forEach((d,i)=>{const f=d.v/T,b=a+f*2*Math.PI,c=COL[i%COL.length];if(f>.9999)p+=`<circle cx=60 cy=60 r=56 fill="${c}"><title>${esc(d.l)}: ${money(d.v)} (100%)</title></circle>`;else{const x1=60+56*Math.cos(a),y1=60+56*Math.sin(a),x2=60+56*Math.cos(b),y2=60+56*Math.sin(b);p+=`<path d="M60 60L${x1} ${y1}A56 56 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${c}"><title>${esc(d.l)}: ${money(d.v)} (${Math.round(f*100)}%)</title></path>`}a=b});
  return `<div class=c><small>${t}</small><div class=row><svg width=120 height=120 viewBox="0 0 120 120">${p}</svg><div>${data.map((d,i)=>`<div><span style="display:inline-block;width:10px;height:10px;background:${COL[i%COL.length]};border-radius:2px"></span> ${esc(d.l)}: ${money(d.v)} (${Math.round(d.v/T*100)}%)</div>`).join('')}</div></div></div>`}

  const row=e=>[e.date,e.type,e.couple||'',cn(e.customerId),e.locCer||e.location||'',e.locRec||'',svcInfo(e).on.join(', '),svcInfo(e).left.join(', '),+e.sold||0,paid(e),rem(e),sum(e.expenses),(+e.sold||0)-sum(e.expenses)];

  const x='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'

addStatus:()=>{const v=$('#nst').value.trim();if(v&&!db.statuses.some(x=>x.n==v)){db.statuses.push({n:v,c:'#8a8f98',k:'open'});save();render()}},delStatus:i=>{const x=db.statuses[+i];if(db.statuses.length<2)return;if(db.leads.some(l=>l.status==x.n)&&!confirm('Some leads use this status. Remove it anyway? They keep the name but lose their colour.'))return;db.statuses.splice(+i,1);save();render()},resetAll:()=>{if(!confirm('Reset ALL data? This deletes every lead, customer, event, drive and setting on this PC. Export a backup first if you may need it.'))return;if(!confirm('Last check: this cannot be undone. Delete everything now?'))return;localStorage.removeItem('weddingcrm');localStorage.removeItem('wcrm_cal');location.reload()},
  newEv:()=>editEvent(),newEvOn:d=>editEvent(null,d),editEv:id=>editEvent(id),
  prev:()=>{cal.setMonth(cal.getMonth()-1);render()},next:()=>{cal.setMonth(cal.getMonth()+1);render()},ics:exportIcs,xls:exportXls,addItem:k=>{const v=$('#n_'+k).value.trim();if(v&&!db[k].includes(v)){db[k].push(v);save();render()}},delItem:id=>{const[k,i]=id.split(':');if(k=='cats'&&db.cats.length<2)return;db[k].splice(+i,1);save();render()},delLogo:()=>{db.biz.logo='';save();render()},openAn:()=>window.open((db.biz||{}).analytics,'_blank'),delSign:()=>{db.biz.sign='';save();render()},newDrive:()=>crud('drives',null,driveFs,{}),editDrive:id=>crud('drives',id,driveFs,{}),addSvc:()=>{const v=$('#ns').value.trim();if(v&&!db.services.includes(v)){db.services.push(v);save();render()}},delSvc:i=>{db.services.splice(+i,1);save();render()},
  theme:()=>{db.theme=db.theme=='dark'?'light':'dark';save();render()},
  addCat:()=>{const v=$('#nc').value.trim();if(v&&!db.cats.includes(v)){db.cats.push(v);save();render()}},
  delCat:i=>{if(db.cats.length>1){db.cats.splice(+i,1);save();render()}},
  exp:saveBackup,imp:()=>$('#imp').click()
};
function render(){
  document.documentElement.dataset.theme=db.theme;applyTheme();
  renderSide();$('#nav').innerHTML=tabs.map(t=>`<button data-t=${t[0]} class="${t[0]==tab?'on':''}">${t[1]}</button>`).join('');
  $('#main').innerHTML=views[tab]();if(tab=='today'){dragInit();calLoad()}
}
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;if(tab!='logins'){vKey=null;vItems=[];vShow={}}render()}};
$('#main').onclick=e=>{const b=e.target.closest('[data-a]');if(b)actions[b.dataset.a](b.dataset.id)};
$('#main').onchange=e=>{if(e.target.id=='yr'){yr=+e.target.value;render()}if(e.target.id=='evy'){evYear=e.target.value;render();return}if(e.target.id=='b2bf'){b2bF=e.target.value;render();return}
  const dd=e.target.dataset;if(dd.st){const[i,f]=dd.st.split(':'),x=db.statuses[+i],v=e.target.value;if(f=='n'){const nv=v.trim();if(!nv||db.statuses.some((y,j)=>j!=+i&&y.n==nv)){render();return}db.leads.forEach(l=>{if(l.status==x.n)l.status=nv});x.n=nv}else x[f]=v;save();render();return}
  if(dd.ti){const[n,f]=dd.ti.split('|');db.teamInfo=db.teamInfo||{};(db.teamInfo[n]=db.teamInfo[n]||{})[f]=e.target.value;save();return}
  if(dd.fee){db.teamFees=db.teamFees||{};db.teamFees[dd.fee]=+e.target.value||0;save();return}
  if(dd.stdays!=null){db.stDays=+e.target.value||30;save();return}
  if(dd.bk!=null){db.bkDays=+e.target.value||0;save();return}if(dd.days){db.svcDays=db.svcDays||{};db.svcDays[dd.days]=+e.target.value||0;save();return}if(dd.tl!=null){db.tl[dd.tl]=e.target.value;save();return}if(dd.ct){db.contract[dd.ct]=e.target.value;save();return}
  const bz=e.target.dataset.biz;if(bz){db.biz=db.biz||{};db.biz[bz]=e.target.value;save();if(bz=='name')renderSide();return}
  if(e.target.id=='sign'){const f=e.target.files[0];if(f){if(f.type!='image/png'){alert('Please choose a PNG image.');e.target.value='';return}const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.biz=db.biz||{};db.biz.sign=c.toDataURL('image/png');save();render()};im.src=fr.result};fr.readAsDataURL(f)}return}
  if(e.target.id=='logo'){const f=e.target.files[0];if(f){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.biz=db.biz||{};db.biz.logo=c.toDataURL('image/png');save();render()};im.src=fr.result};fr.readAsDataURL(f)}return}
  const k=e.target.dataset.col;if(k){db.cols=e.target.checked?[...db.cols,k]:db.cols.filter(x=>x!=k);save();render()}};
$('#m').onclick=e=>{if(e.target.id=='m')closeM()};
document.addEventListener('click',e=>{const t=e.target;if(t.tagName=='INPUT'&&(t.type=='date'||t.type=='time')&&t.showPicker)try{t.showPicker()}catch{}});
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=Object.assign(db,JSON.parse(r.result));vKey=null;vItems=[];save();render()}catch{alert('This file is not a valid backup.')}};r.readAsText(f)};
render();setTimeout(autoBackup,3000);
</script></body></html>
