function editLead(id){
  const fs=leadFs(),l=id?JSON.parse(JSON.stringify(db.leads.find(x=>x.id==id))):{status:(db.statuses[0]||{n:'New'}).n,type:db.cats[0]};l.log=l.log||[];if(!id&&!l.created)l.created=today();const old=l.status;
  const sync=()=>{Object.assign(l,read(fs));document.querySelectorAll('#m .ll').forEach(el=>{l.log[el.dataset.i][el.dataset.f]=el.value})};
  const put=()=>{l.log.sort((a,b)=>(a.date||'').localeCompare(b.date||''));const i=db.leads.findIndex(x=>x.id==l.id);if(i>=0)db.leads[i]=l;else{l.id=uid();db.leads.push(l)}save()};
  const draw=()=>{
    const G=ks=>`<div class=grid>${fields(fs.filter(f=>ks.includes(f.k)),l)}</div>`;
    modal(`<h3>${id?'Edit':'New'} lead</h3><div class=lsub>${[l.type,l.date,l.status,id?leadAge(l):''].filter(Boolean).map(esc).join('  ·  ')}</div>
    <div class=msec><div class=mh>Contact</div>${G(['name','phone','email','viber','whatsapp'])}</div>
    <div class=msec><div class=mh>Event</div>${G(['type','date','source','package'])}</div>
    <div class=msec><div class=mh>Status & follow-up</div>${G(['status','followUp'])}</div>
    <div class=msec><div class=mh>Notes</div>${G(['notes'])}</div>
    <div class=msec><div class=mh>Updates</div>
    ${l.log.map((x,i)=>`<div class=row><input class=ll type=date data-i=${i} data-f=date value="${x.date}" style="max-width:150px;flex:none"><input class=ll data-i=${i} data-f=text value="${esc(x.text)}"><button data-rm=${i}>✕</button></div>`).join('')||'<small style="color:var(--mu)">No updates yet.</small>'}
    <div class=row><input id=nd type=date value="${today()}" style="max-width:150px;flex:none"><input id=nt placeholder="What happened? (call, meeting, quote sent…)"><button id=ad>+ Add update</button></div>
    <p style="color:var(--mu);margin:8px 0 0"><small>A status change is added to the updates automatically when you save.</small></p></div>
    <div class="row stick"><button class=pri id=sv>Save</button><button id=cx>Cancel</button>${id?'<button id=qb>Quote (PDF)</button><button id=cv>Convert to client + event</button><button id=msgb>Message…</button><button class=dg id=dl>Delete</button>':''}</div>`);
    $('#cx').onclick=closeM;
    $('#ad').onclick=()=>{sync();const t=$('#nt').value.trim();if(!t)return;l.log.push({date:$('#nd').value||today(),text:t});draw()};
    document.querySelectorAll('#m [data-rm]').forEach(b=>b.onclick=()=>{sync();l.log.splice(+b.dataset.rm,1);draw()});
    $('#sv').onclick=()=>{sync();const cl=l.date?db.events.filter(x=>x.date==l.date):[];if(cl.length&&!confirm('There is already an event on this date: '+cl.map(title).join(', ')+'. Save anyway?'))return;if(!id)l.log.push({date:today(),text:'Lead added ('+l.status+')'});else if(l.status!=old)l.log.push({date:today(),text:'Status: '+old+' → '+l.status});put();closeM();render()};
    if(id){
      $('#msgb').onclick=()=>{sync();actions.msgLead(l.id)};
      $('#qb').onclick=()=>{sync();put();quoteDlg({name:l.name,date:l.date,type:l.type,pkg:l.package,leadId:l.id})};
      $('#dl').onclick=()=>{if(confirm('Delete this lead?')){db.leads=db.leads.filter(x=>x.id!=id);save();closeM();render()}};
      $('#cv').onclick=()=>{sync();const c={id:uid(),name:l.name,phone:l.phone,email:l.email,viber:l.viber,whatsapp:l.whatsapp,notes:''};db.customers.push(c);db.events.push({id:uid(),source:l.source||'',customerId:c.id,type:l.type,date:l.date,time:'',location:'',staff:0,sold:0,deposit:0,payments:[],expenses:[],notes:l.notes||''});const w=(db.statuses.find(x=>x.k=='won')||{n:'Won'}).n;l.log.push({date:today(),text:'Converted to client + event'+(l.status!=w?' (status: '+l.status+' → '+w+')':'')});l.status=w;put();closeM();tab='events';render()};
    }
  };draw();
}

function pie(t,data){data=data.filter(d=>d.v>0);const T=data.reduce((s,d)=>s+d.v,0);if(!T)return `<div class=c><small>${t}</small><div class=empty>No data</div></div>`;let a=-Math.PI/2,p='';
  data.forEach((d,i)=>{const f=d.v/T,b=a+f*2*Math.PI,c=COL[i%COL.length];if(f>.9999)p+=`<circle cx=60 cy=60 r=56 fill="${c}"><title>${esc(d.l)}: ${money(d.v)} (100%)</title></circle>`;else{const x1=60+56*Math.cos(a),y1=60+56*Math.sin(a),x2=60+56*Math.cos(b),y2=60+56*Math.sin(b);p+=`<path d="M60 60L${x1} ${y1}A56 56 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${c}"><title>${esc(d.l)}: ${money(d.v)} (${Math.round(f*100)}%)</title></path>`}a=b});
  return `<div class=c><small>${t}</small><div class=row><svg width=120 height=120 viewBox="0 0 120 120">${p}</svg><div>${data.map((d,i)=>`<div><span style="display:inline-block;width:10px;height:10px;background:${COL[i%COL.length]};border-radius:2px"></span> ${esc(d.l)}: ${money(d.v)} (${Math.round(d.v/T*100)}%)</div>`).join('')}</div></div></div>`}

function exportXls(){

  const sheet=(n,rows)=>`<Worksheet ss:Name="${n}"><Table>${rows.map(r=>`<Row>${r.map(cell).join('')}</Row>`).join('')}</Table></Worksheet>`;
  const row=e=>[e.date,e.type,e.couple||'',cn(e.customerId),e.locCer||e.location||'',e.locRec||'',svcInfo(e).on.join(', '),svcInfo(e).left.join(', '),+e.sold||0,paid(e),rem(e),sum(e.expenses),(+e.sold||0)-sum(e.expenses)];
  const tot=ev.reduce((t,e)=>{t[0]+=+e.sold||0;t[1]+=paid(e);t[2]+=sum(e.expenses);return t},[0,0,0]);
  const x='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
   +sheet('Summary',[['Year',yr],['Events',ev.length],['Sold',tot[0]],['Received',tot[1]],['To collect',tot[0]-tot[1]],['Expenses',tot[2]],['Profit',tot[0]-tot[2]]])
   +sheet('Events',[['Date','Category','Couple','Client','Ceremony','Reception','Services','Not delivered','Sold','Received','Remaining','Expenses','Profit'],...ev.map(row)])
   +sheet('By category',[['Category','Events','Sold','Expenses','Profit'],...db.cats.map(c=>{const q=ev.filter(e=>e.type==c),s=q.reduce((t,e)=>t+(+e.sold||0),0),p=q.reduce((t,e)=>t+sum(e.expenses),0);return[c,q.length,s,p,s-p]})])
   +sheet('Prints',[['Date','Client / event','Status','Items','Total','Lab cost'],...(db.orders||[]).filter(o=>(o.date||'').startsWith(String(yr))).map(o=>[o.date||'',ordWho(o),o.status||'',(o.lines||[]).map(x=>(x.q>1?x.q+'x ':'')+x.d).join('; '),ordTot(o),+o.cost||0])])
   +'</Workbook>';
  download('WeddingCRM-'+yr+'.xls',x,'application/vnd.ms-excel');
}

  d.innerHTML=`<form class=lk>${b.logo?`<img src="${b.logo}" style="max-width:150px;max-height:70px;margin-bottom:10px">`:''}<h2 style="margin:0 0 4px">${esc(b.name||'Wedding CRM')}</h2><p class=d style="margin:0 0 14px">Sign in to continue</p><label>Username<input id=lu autocomplete=username autofocus></label><label style="margin-top:8px">Password<input id=lp type=password autocomplete=current-password></label><div id=le class=neg style="min-height:20px;margin:8px 0 2px;font-size:13px"></div><button class=pri id=lb type=submit style="width:100%">Sign in</button>${getAuth()?'<p style="margin:12px 0 0;text-align:center"><a href="#" id=lf style="font-size:12.5px;color:var(--mu)">Forgot username or password?</a></p>':'<p class=d style="margin:12px 0 0;text-align:center">First time? Username <b>user</b>, password <b>1234</b>. Change them in Settings.</p>'}</form>`;
  document.body.appendChild(d);setTimeout(()=>$('#lu').focus(),50);
  d.querySelector('form').onsubmit=async ev=>{ev.preventDefault();$('#lb').disabled=true;const ok=await checkLogin($('#lu').value,$('#lp').value);if(ok){try{sessionStorage.setItem('wcrm_ok','1')}catch(x){}d.remove()}else{$('#le').textContent='Wrong username or password.';$('#lp').value='';$('#lb').disabled=false;$('#lp').focus()}};
  const lf=$('#lf');if(lf)lf.onclick=e=>{e.preventDefault();if(!confirm('There is no way to recover a forgotten password, because it is not stored anywhere readable.\n\nThe only option is to erase ALL CRM data on this PC and start again (then restore a backup file if you have one).\n\nContinue?'))return;if(prompt('Type DELETE to erase all CRM data on this PC')!=='DELETE')return;localStorage.removeItem('weddingcrm');localStorage.removeItem(AUTHK);try{sessionStorage.setItem('wcrm_ok','1')}catch(x){}location.reload()}}
try{if(!sessionStorage.getItem('wcrm_ok'))showLock()}catch(x){showLock()}
</script></body></html>
